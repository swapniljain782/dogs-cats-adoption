apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pet-classifier
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: pet-adoption

  source:
    repoURL: "https://github.com/OWNER/REPO.git"   # <-- set to your actual repo URL
    targetRevision: main
    path: deployment/k8s
    kustomize: {}
    # Jenkins updates the image tag in kustomization.yaml (via `kustomize edit set
    # image`) and pushes to `main` - ArgoCD picks up that commit automatically.

  destination:
    server: https://kubernetes.default.svc
    namespace: pet-adoption

  syncPolicy:
    automated:
      prune: true       # remove resources deleted from git
      selfHeal: true     # revert manual kubectl edits back to git state
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m

  revisionHistoryLimit: 10
