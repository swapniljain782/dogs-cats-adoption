# SECURITY: this is a TEMPLATE. Copy it to `secret.yaml`, fill in a real
# key, and DO NOT commit that file - it's already excluded via .gitignore.
#
# For anything beyond local/demo use, don't hand-apply plaintext Secrets at
# all - use one of:
#   - Sealed Secrets (bitnami-labs/sealed-secrets): encrypts the Secret so
#     the *encrypted* form is safe to commit; the controller decrypts it
#     in-cluster.
#   - External Secrets Operator: syncs from Vault/AWS Secrets Manager/GCP
#     Secret Manager/etc. into a real k8s Secret, so the source of truth
#     never lives in git or in `kubectl get secret -o yaml` output.
#
# To generate the base64 value for a real key:
#   echo -n 'your-real-api-key' | base64
apiVersion: v1
kind: Secret
metadata:
  name: pet-classifier-secrets
  namespace: pet-adoption
type: Opaque
data:
  api-key: Q0hBTkdFLU1FLXBsYWNlaG9sZGVyLWtleQ==  # base64("CHANGE-ME-placeholder-key")
