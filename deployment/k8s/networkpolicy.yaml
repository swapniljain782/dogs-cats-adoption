# Default-deny-ish policy: only allow what the service actually needs.
# NOTE: requires a CNI that enforces NetworkPolicy (Calico, Cilium, etc.) -
# kind's default kindnet does NOT enforce these; fine to apply, just won't
# be enforced locally unless you install a policy-capable CNI.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pet-classifier-netpol
  namespace: pet-adoption
spec:
  podSelector:
    matchLabels:
      app: pet-classifier
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow traffic from anything else in this namespace (e.g. the Service,
    # a same-namespace ingress controller) and from a dedicated
    # ingress-nginx namespace if you're using one.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: pet-adoption
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8000
  egress:
    # DNS - required for any service to resolve names at all.
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # This service makes no outbound calls to other services or the
    # internet at inference time (the model is baked into the image), so
    # egress is otherwise fully denied. If you later add a remote model
    # registry, external logging sink, etc., add a scoped rule here rather
    # than opening egress broadly.
