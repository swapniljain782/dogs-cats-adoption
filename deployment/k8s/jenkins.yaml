apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jenkins-pvc
  namespace: jenkins
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jenkins
  namespace: jenkins
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jenkins
  template:
    metadata:
      labels:
        app: jenkins
    spec:
      # jenkins-deployer (see deployment/k8s/jenkins-rbac.yaml) is the SA the
      # pipeline's kubectl calls (smoke test port-forward) run under -
      # in-cluster auth, no kubeconfig credential needed.
      serviceAccountName: jenkins-deployer
      securityContext:
        fsGroup: 1000
      containers:
        - name: jenkins
          # Built from deployment/jenkins/Dockerfile (jenkins/jenkins:lts base
          # + kubectl/kustomize/argocd baked in) - NOT jenkins/inbound-agent,
          # which is an agent image that crashes when run as a standalone
          # controller (it has no web UI, it only connects outward via JNLP).
          image: ghcr.io/swapniljain782/dogs-cats-adoption/jenkins-agent:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: jenkins-home
              mountPath: /var/jenkins_home
      volumes:
        - name: jenkins-home
          persistentVolumeClaim:
            claimName: jenkins-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: jenkins
  namespace: jenkins
spec:
  type: ClusterIP
  selector:
    app: jenkins
  ports:
    - port: 8080
      targetPort: 8080
