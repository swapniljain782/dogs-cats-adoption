apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: pet-adoption
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: pet-adoption
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # Port-forward needs its own explicit permission on the pods/portforward
    # subresource - easy to miss, and kubectl port-forward fails silently
    # with a generic "error" if this is absent.
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: pet-adoption
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: pet-adoption
roleRef:
  kind: Role
  name: jenkins-deployer-role
  apiGroup: rbac.authorization.k8s.io
---
# Kubernetes 1.24+ no longer auto-creates a long-lived token Secret for each
# ServiceAccount, so we ask for one explicitly here (rather than the
# `kubectl create token` command, which mints a *short-lived* token that
# would expire and break the pipeline later).
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: pet-adoption
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
type: kubernetes.io/service-account-token
