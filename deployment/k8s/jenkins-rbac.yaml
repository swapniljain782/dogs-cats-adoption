# jenkins-deployer's ServiceAccount lives in the *jenkins* namespace because
# that's where the Kubernetes-plugin agent pods (the ones running the
# Jenkinsfile's `sh` steps, incl. `kubectl port-forward` for the smoke test)
# actually get scheduled - a Pod can only use a ServiceAccount that exists in
# its own namespace. The Role/RoleBinding below then grant that SA access
# into the pet-adoption namespace, which is where the actual permissions are
# needed (reading/port-forwarding the pet-classifier Service).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: jenkins
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: pet-adoption
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    # Port-forward needs its own explicit permission on the pods/portforward
    # subresource - easy to miss, and kubectl port-forward fails silently
    # with a generic "error" if this is absent.
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: pet-adoption
subjects:
  # Cross-namespace reference: this ServiceAccount lives in "jenkins", but
  # the Role it's bound to lives in "pet-adoption" - that's valid, and is
  # exactly the mechanism that lets an agent pod running in one namespace
  # act on resources in another.
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: jenkins
roleRef:
  kind: Role
  name: jenkins-deployer-role
  apiGroup: rbac.authorization.k8s.io
