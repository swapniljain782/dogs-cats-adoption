apiVersion: apps/v1
kind: Deployment
metadata:
  name: pet-classifier
  namespace: pet-adoption
  labels:
    app: pet-classifier
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: pet-classifier
  template:
    metadata:
      labels:
        app: pet-classifier
    spec:
      # Pod-level security baseline - enforced again per-container below.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: pet-classifier
          # Placeholder tag - overwritten in CI via `kustomize edit set image`
          image: ghcr.io/swapniljain782/dogs-cats-adoption/pet-classifier:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: MODEL_PATH
              value: /app/artifacts/model.pt
            # Enables API-key auth on /predict when the Secret exists (see
            # secret.example.yaml). `optional: true` means the deployment
            # still comes up without it - fine for demos, but set a real
            # secret in any environment reachable outside your cluster.
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: pet-classifier-secrets
                  key: api-key
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # uvicorn/Pillow may write small temp files; everything else in
            # the image is read-only at runtime.
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
      volumes:
        - name: tmp
          emptyDir: {}
