services:
  pet-classifier:
    image: ${IMAGE:-pet-classifier:local}
    container_name: pet-classifier
    ports:
      - "8000:8000"
    environment:
      - MODEL_PATH=/app/artifacts/model.pt
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
