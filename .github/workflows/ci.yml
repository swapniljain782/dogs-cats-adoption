name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pet-classifier

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Run unit tests
        run: pytest -v --junitxml=pytest-report.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-report
          path: pytest-report.xml

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure a servable model artifact exists
        run: |
          mkdir -p artifacts
          if [ ! -f artifacts/model.pt ]; then
            echo "No trained model checkpoint found; creating a placeholder so the image builds."
            # This job never installs project dependencies (it only builds/pushes
            # the image), so torch isn't on this runner by default - install a
            # throwaway CPU-only copy just for this fallback rather than assuming
            # it's already present.
            python3 -m venv /tmp/placeholder-venv
            /tmp/placeholder-venv/bin/pip install --quiet --extra-index-url https://download.pytorch.org/whl/cpu torch
            /tmp/placeholder-venv/bin/python -c "
          import torch, sys
          sys.path.insert(0, '.')
          from src.models.model import build_model
          torch.save(build_model().state_dict(), 'artifacts/model.pt')
          "
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
          # prefix= (empty) overrides docker/metadata-action's default "sha-"
          # prefix on type=sha tags - without this, the image gets tagged
          # "sha-<commit>" but the Jenkins trigger below sends the bare
          # "<commit>" as IMAGE_TAG, and Jenkinsfile builds the image
          # reference from that bare value too. Mismatch = Kubernetes trying
          # to pull a tag that was never actually pushed ("Back-off pulling
          # image" / ErrImagePull that looks like the image doesn't exist).

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-jenkins-cd:
    # CD now lives entirely in Jenkins (see Jenkinsfile) - this just hands off
    # the new image tag. Jenkins bumps the GitOps manifest, ArgoCD syncs the
    # cluster, and Jenkins smoke-tests + rolls back on failure.
    #
    # Note: the `secrets` context isn't accessible inside a job-level `if:`
    # expression (GitHub Actions restriction), so the "is Jenkins configured
    # yet" check happens inside the shell step instead, via a plain env-var
    # emptiness check - that exits 0 (not a failure) until the JENKINS_URL /
    # JENKINS_USER / JENKINS_API_TOKEN repo secrets are set.
    needs: build-and-push
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins CD pipeline
        env:
          JENKINS_URL: ${{ secrets.JENKINS_URL }}
          JENKINS_USER: ${{ secrets.JENKINS_USER }}
          JENKINS_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}
        run: |
          if [ -z "$JENKINS_URL" ]; then
            echo "JENKINS_URL not configured yet - skipping (expected until Jenkins secrets are set)."
            exit 0
          fi
          # -w prints the HTTP status code, -o captures the body separately -
          # curl -f alone hides the response body on error, which is exactly
          # what's needed to diagnose a failure (401 vs 403 vs 404 vs ngrok's
          # interstitial page all look identical as a bare exit code).
          http_status=$(curl -s -X POST -o /tmp/jenkins_response.txt -w "%{http_code}" \
            -u "$JENKINS_USER:$JENKINS_TOKEN" \
            "$JENKINS_URL/job/pet-classifier-cd/buildWithParameters?IMAGE_TAG=${{ github.sha }}")
          echo "HTTP status: $http_status"
          echo "Response body:"
          cat /tmp/jenkins_response.txt
          if [ "$http_status" -ge 400 ]; then
            echo "Jenkins trigger failed."
            exit 1
          fi
          echo "Triggered Jenkins CD for image tag ${{ github.sha }}"
