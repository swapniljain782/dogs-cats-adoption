# NOTE: This CD job runs `docker compose` directly on the runner, so it assumes a
# self-hosted GitHub Actions runner (e.g. your own VM/laptop configured as a runner)
# acting as the deployment target. On a GitHub-hosted runner the containers would
# simply vanish when the ephemeral VM is torn down. For a purely GitHub-hosted demo,
# swap the "Deploy" step for an SSH step (appleboy/ssh-action) targeting a real VM,
# or point kubectl/Argo CD at a remote cluster instead.
#
# This is the Docker Compose deployment path. For Kubernetes, use
# .github/workflows/cd-k8s.yml instead - enable only one of the two so they
# don't race to redeploy the same image.
name: CD (Docker Compose)

on:
  workflow_run:
    workflows: ["CI"]
    branches: ["main"]
    types: [completed]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/pet-classifier

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy via Docker Compose
        working-directory: deployment
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
        run: |
          export IMAGE
          docker compose pull
          docker compose up -d
          echo "Waiting for service to become ready..."
          sleep 5

      - name: Smoke test - health check
        run: |
          for i in $(seq 1 10); do
            if curl -sf http://localhost:8000/health; then
              echo "Health check passed"
              exit 0
            fi
            echo "Retrying health check ($i/10)..."
            sleep 3
          done
          echo "Health check failed after retries"
          exit 1

      - name: Smoke test - prediction call
        run: |
          curl -sf -o sample_test.jpg https://upload.wikimedia.org/wikipedia/commons/3/3a/Cat03.jpg || \
            python -c "
          import numpy as np
          from PIL import Image
          Image.fromarray(np.random.randint(0,255,(224,224,3),dtype='uint8')).save('sample_test.jpg')
          "
          response=$(curl -sf -F "file=@sample_test.jpg" http://localhost:8000/predict)
          echo "Prediction response: $response"
          echo "$response" | python -c "import json,sys; d=json.load(sys.stdin); assert 'label' in d and 'probability' in d"

      - name: Roll back on smoke test failure
        if: failure()
        working-directory: deployment
        run: |
          echo "Smoke tests failed - rolling back to previous image is a manual/extended step."
          docker compose logs --tail=100
          exit 1
